:root{--bg:#f7f8fa;--panel:#fff;--line:#e2e6ee;--fg:#141821;--dim:#5a6474;

:root[data-theme="light"]{--bg:#f7f8fa;--panel:#fff;--line:#e2e6ee;--fg:#141821;
--dim:#5a6474;--good:#1a7f37;--warn:#9a6700;--bad:#cf222e;--accent:#1f6feb}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{padding:20px 22px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:17px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}

main{padding:18px 22px;max-width:1500px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.card .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.card .v{font-size:21px;font-weight:600;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .n{color:var(--dim);font-size:11px;margin-top:3px}
.funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px;position:relative;overflow:hidden}
.stage .tag{font-size:10px;letter-spacing:.09em;color:var(--accent);text-transform:uppercase}
.stage .big{font-size:25px;font-weight:600;margin:7px 0 2px;letter-spacing:-.02em}
.stage .rate{color:var(--dim);font-size:12px}
.bar{height:4px;background:var(--accent);opacity:.5;position:absolute;bottom:0;left:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:500;padding:8px 9px;border-bottom:1px solid var(--line);
white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--bg)}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel)}
td:first-child{border-left:3px solid transparent}
tr.sev-bad td:first-child{border-left-color:var(--bad)}
tr.sev-warn td:first-child{border-left-color:var(--warn)}
tr.sev-good td:first-child{border-left-color:var(--good)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.t{max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;border:1px solid var(--line)}
.good{color:var(--good);border-color:var(--good)}.warn{color:var(--warn);border-color:var(--warn)}
.bad{color:var(--bad);border-color:var(--bad)}.dim{color:var(--dim)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.card .v,.stage .big{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:440px;background:var(--panel);color:var(--fg);border:1px solid var(--line);
border-radius:9px;padding:13px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button.act{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
button.ghost{background:none;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
.row{display:flex;gap:9px;align-items:center;margin:11px 0;flex-wrap:wrap}
.msg{color:var(--dim);font-size:12px}
.filters input,.filters select{background:var(--panel);color:var(--fg);border:1px solid var(--line);
border-radius:7px;padding:7px 10px;font-size:13px}
h2{font-size:14px;margin:22px 0 9px}
.note{color:var(--dim);font-size:12px;margin:8px 0 16px;max-width:760px}
code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:12px}

attack. In that order, always"}, {"id": "A2", "family": "Attack", "name": "Category targeting with a price refinement", "status": "off", "gate": "none, and that is the point", "why": "Target the category filtered to books priced ABOVE ours. Every shopper who sees us is looking at something more expensive, so we are the value option by construction. The best attack that does not need reviews.", "judge": "cap the budget hard, category targets are broad"}, {"id": "A3", "family": "Attack", "name": "Search-term harvesting", "status": "partial", "gate": "needs auto campaigns delivering", "why": "The ONLY play that compounds. Every other play rents traffic; this turns spend into a permanent asset. A phrase proven to convert is free intelligence for every book we launch after it.", "judge": "converting terms promoted per dollar"}, {"id": "A4", "family": "Attack", "name": "Head-term conquesting", "status": "off", "gate": "royalty per sale would need to roughly triple", "why": "'childrens books' costs about $1.01 a click. Our affordable click is $0.24. Four times our ceiling before we start.", "judge": "not attempted"}], "stages": {"counts": {"exploit": 0, "harvest": 1, "discovery": 34, "defend": 0, "gate": 43, "rehab": 13}, "spec": {"gate": {"label": "Gate", "objective": "earn the right to spend", "judgedOn": "listing quality, not ads", "endsWhen": "the listing passes every gate check and a tranche slot opens", "acosRange": null, "budget": 0.0, "bidScale": null}, "discovery": {"label": "Discovery", "objective": "find which phrases exist and which convert, not profit", "judgedOn": "converting search terms found per dollar", "endsWhen": "40 clicks or $15 or 14 days, whichever comes first", "acosRange": [100, 250], "budget": 2.0, "bidScale": 0.55}, "harvest": {"label": "Harvest", "objective": "convert discovery into permanent structure", "judgedOn": "converting terms promoted to exact", "endsWhen": "every 2+ order term is an exact keyword and the losers are negated", "acosRange": [60, 120], "budget": 3.0, "bidScale": null}, "exploit": {"label": "Exploit", "objective": "profit", "judgedOn": "ACOS against this book's own breakeven", "endsWhen": "it stops beating breakeven, or it saturates and moves to Defend", "acosRange": null, "budget": 5.0, "bidScale": null}, "defend": {"label": "Defend", "objective": "hold the shelf, cross-promote the series", "judgedOn": "share of our own carousel", "endsWhen": "reviewed weekly, not daily", "acosRange": null, "budget": 1.0, "bidScale": 0.55}, "rehab": {"label": "Rehab", "objective": "ads off, fix the listing or the book", "judgedOn": "rating recovery", "endsWhen": "rating recovers above 4.0, or the book is republished", "acosRange": null, "budget": 0.0, "bidScale": null}}, "blockers": [{"reason": "royalty assumed, not read off KDP", "books": 33}, {"reason": "coloring book", "books": 9}, {"reason": "listed at 8.20, under the 9.99 print royalty cliff", "books": 7}, {"reason": "royalty unknown", "books": 3}, {"reason": "listed at 8.23, under the 9.99 print royalty cliff", "books": 2}, {"reason": "rated 2.0", "books": 2}, {"reason": "kdp status draft", "books": 2}, {"reason": "rated 3.0", "books": 2}, {"reason": "list price unknown", "books": 1}, {"reason": "listed at 9.49, under the 9.99 print royalty cliff", "books": 1}], "ready": 8, "exit": {"clicks": 40, "spend": 15.0, "days": 14}}, "ladder": [{"rung": 1, "symptom": "Impressions near zero", "means": "we are not winning auctions at all", "fix": "keyword STATES first, then bid, then match type"}, {"rung": 2, "symptom": "Impressions fine, CTR under 0.3%", "means": "shoppers see us and scroll past", "fix": "keyword relevance (free), then cover thumbnail (slow), then title"}, {"rung": 3, "symptom": "CTR fine, CVR under 5%", "means": "they click and the page loses them", "fix": "reviews, then price, then the first two lines of the description"}, {"rung": 4, "symptom": "CVR fine, ACOS above breakeven", "means": "we are simply paying too much per click", "fix": "bid to the ceiling, negate expensive non-converters, placements to 0%"}, {"rung": 5, "symptom": "All fine, volume low", "means": "budget or bid limited, which is a good problem", "fix": "scale one lever at a time: budget +20-30% OR bid +10-15%, never both"}]}</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const fmt = (v,d=0)=> v==null||v===''? '<span class="dim">-</span>' : Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const money = v => v==null? '<span class="dim">-</span>' : '$'+Number(v).toFixed(2);
const pct = v => v==null? '<span class="dim">-</span>' : Number(v).toFixed(1)+'%';

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['overview','economics','plays','stages','books','plan','rules'].forEach(t=>$('#'+t).hidden = t!==b.dataset.tab);
});

/* ---------- plays ---------- */
const P = D.plays || [];
const SC = {done:'good', on:'good', partial:'warn', off:'dim', blocked:'bad'};
const fam = f => P.filter(p=>p.family===f);
const playTable = f => `
<div class="wrap"><table><thead><tr><th>#</th><th>Play</th><th>Status</th>
<th>Gate</th><th>Why it earns its place</th><th>How we judge it</th></tr></thead><tbody>
${fam(f).map(p=>`<tr><td class="dim">${p.id}</td><td><b>${p.name}</b></td>
<td class="${SC[p.status]||''}">${p.status.toUpperCase()}</td>
<td class="dim">${p.gate}</td><td>${p.why}</td><td class="dim">${p.judge}</td></tr>`).join('')}
</tbody></table></div>`;
$('#plays').innerHTML = `
<p class="dim">Every play we run, could run, or have deliberately ruled out. Judged on one
question: <b>does it lower cost per acquired sale, or raise what a sale is worth?</b>
Anything that only moves traffic around is rearranging deck chairs until the arithmetic clears.</p>
<div class="cards">
  <div class="card"><div class="k">Running or done</div>
    <div class="v good">${P.filter(p=>['on','done'].includes(p.status)).length}</div>
    <div class="n">of ${P.length} plays</div></div>
  <div class="card"><div class="k">Available, not running</div>
    <div class="v warn">${P.filter(p=>['off','partial'].includes(p.status)).length}</div>
    <div class="n">the backlog</div></div>
  <div class="card"><div class="k">Gated shut</div>
    <div class="v bad">${P.filter(p=>p.status==='blocked').length}</div>
    <div class="n">attack needs reviews first</div></div>
</div>
<h2>Economic plays</h2>
<p class="dim">These change what a click is worth. Biggest effect, slowest to act.
Per our own data this is where the account is won or lost.</p>
${playTable('Economic')}
<h2>Defence</h2>
<p class="dim">Stops money leaking, or stops us paying to lose. Judged on money NOT spent,
not on ACOS. Cheap, immediate, low ceiling.</p>
${playTable('Defence')}
<h2>Attack</h2>
<p class="dim">Buys demand currently going to someone else. Works only when a shopper
comparing us to them picks us, which is why it is gated hard. Today, 29 of 43 advertised
books have zero reviews, so most of this is correctly switched off.</p>
${playTable('Attack')}
<h2>The order to run them in</h2>
<p>Sequencing matters more than the individual plays, because several are gated on others.</p>
<ol>
<li><b>E1 price test.</b> Nothing else clears the arithmetic. Do this first.</li>
<li><b>D1 own-ASIN defence and D3 negative ASINs.</b> Cheap, immediate, no gate.</li>
<li><b>A3 harvesting.</b> Unblocked as of today. The only compounding play.</li>
<li><b>D2 negatives</b>, automatic once harvesting runs.</li>
<li><b>E3 reviews.</b> Slow, and it gates all of Attack.</li>
<li><b>A2 category targeting with a price refinement.</b> Best attack that needs no reviews.</li>
<li><b>A1 competitor targeting.</b> Book by book as reviews arrive, never as a blanket switch.</li>
</ol>
<p><b>Do not run Attack before the Economic plays.</b> Attacking with an arithmetic that does
not clear just loses money faster, and in a more interesting way.</p>
<h2>Deliberately not doing</h2>
<div class="wrap"><table><thead><tr><th>Play</th><th>Why not</th></tr></thead><tbody>
<tr><td>Sponsored Brands / Video</td><td>needs a registered brand; KDP accounts generally cannot, and the reporting is not in our API</td></tr>
<tr><td>Lockscreen ads</td><td>managed inside KDP, not in the Ads API at all</td></tr>
<tr><td>Dayparting</td><td>not a native Sponsored Products feature, not worth the complexity at $1 a day</td></tr>
<tr><td>Paid keyword tools</td><td>they repackage Amazon's own suggestions with a volume estimate. Our binding constraint is CPC against royalty, which our own click data reports faster</td></tr>
</tbody></table></div>`;

/* ---------- keyword economics ---------- */
const E = D.economics || [];
const VC = {'pays':'good','loses':'bad','cannot work':'bad','unproven':'warn'};
const needs = E.map(k=>k.cvr_needed).filter(v=>v!=null).sort((a,b)=>a-b);
const cpcs  = E.map(k=>k.cpc).filter(v=>v!=null).sort((a,b)=>a-b);
const contrib = E.reduce((s,k)=>s+(k.contribution||0),0);
$('#economics').innerHTML = E.length ? `
<p class="dim">For every keyword that has ever taken a click: the conversion rate it would need
<b>at the price we actually paid</b>, against the highest its true rate can plausibly be
(95% upper bound). When the ceiling is below the requirement, the keyword cannot pay at that
CPC. That is a decision, not a guess.</p>
<div class="cards">
  <div class="card"><div class="k">Ad contribution</div>
    <div class="v ${contrib<0?'bad':'good'}">${money(contrib)}</div>
    <div class="n">royalty earned minus spend &middot; the north star</div></div>
  <div class="card"><div class="k">CVR needed, median</div><div class="v">${needs.length?pct(needs[Math.floor(needs.length/2)]):'-'}</div>
    <div class="n">books convert at 5 to 15%</div></div>
  <div class="card"><div class="k">Cheapest click ever</div><div class="v">${cpcs.length?money(cpcs[0]):'-'}</div>
    <div class="n">we can afford about $0.24</div></div>
  <div class="card"><div class="k">Keywords that pay</div>
    <div class="v ${E.filter(k=>k.verdict_math==='pays').length?'':'bad'}">${E.filter(k=>k.verdict_math==='pays').length}</div>
    <div class="n">of ${E.length} with clicks</div></div>
</div>
<div class="wrap"><table><thead><tr><th>Keyword</th><th>Match</th><th class="num">Clicks</th>
<th class="num">Orders</th><th class="num">Spend</th><th class="num">CPC</th>
<th class="num">CVR needed</th><th class="num">CVR ceiling</th><th class="num">Contribution</th>
<th>Verdict</th></tr></thead><tbody>
${E.map(k=>`<tr><td>${k.keyword}</td><td class="dim">${k.match||''}</td>
<td class="num">${fmt(k.clicks)}</td><td class="num">${fmt(k.orders)}</td>
<td class="num">${money(k.spend)}</td><td class="num">${money(k.cpc)}</td>
<td class="num">${pct(k.cvr_needed)}</td><td class="num">${pct(k.cvr_upper)}</td>
<td class="num ${(k.contribution||0)<0?'bad':'good'}">${money(k.contribution)}</td>
<td class="${VC[k.verdict_math]||''}">${k.verdict_math||''}</td></tr>`).join('')}
</tbody></table></div>
<h2>What this forces</h2>
<p>Every keyword needs ${needs.length?pct(needs[0]):''} to ${needs.length?pct(needs[needs.length-1]):''}
conversion to break even. Children's picture books convert at 5 to 15%. At the prices actually paid,
essentially no keyword here can pay for itself.</p>
<p><b>This is not a targeting or creative failure.</b> CTR is 1.77%, roughly four times the
Sponsored Products norm for books, so the ads are doing their job. The arithmetic underneath
them does not work.</p>
<p><b>The binding lever is price, not bids.</b> Royalty is 0.6 x list minus print cost, so every
dollar of list price is 60 cents of headroom per click. Moving a book from $9.99 to $12.99 takes
the affordable click from about $0.24 to about $0.42, which is the difference between a business
that cannot work and one that might. Run the price test before spending another month on bids.</p>`
: '<p class="dim">No keyword-level rows with clicks yet.</p>';

/* ---------- stages ---------- */
const S = D.stages || {counts:{},spec:{},blockers:[]};
const G = D.guard || {};
const stageOrder = ['exploit','harvest','discovery','defend','gate','rehab'];
const stageBooks = k => D.books.filter(b=>b.stage===k);
$('#stages').innerHTML = `
<p class="dim">A book is always in exactly one stage. The stage decides structure, bid, budget,
the metric we judge on, and what ends it. This is computed from the catalogue and the daily ad
history, not asserted.</p>
<div class="cards">
  ${stageOrder.filter(k=>S.counts[k]).map(k=>`<div class="card">
    <div class="k">${(S.spec[k]||{}).label||k}</div><div class="v">${S.counts[k]}</div>
    <div class="n">${(S.spec[k]||{}).judgedOn||''}</div></div>`).join('')}
</div>
${G.state? `<div class="cards"><div class="card"><div class="k">Month to date</div>
  <div class="v ${G.state!=='OK'?'bad':''}">${money(G.spend_mtd)}</div>
  <div class="n">of ${money(G.ramped_cap_usd)} cap &middot; ${G.state}</div></div>
  <div class="card"><div class="k">Projected month end</div><div class="v">${money(G.projected_month_end)}</div>
  <div class="n">brake pauses everything at 100%</div></div>
  <div class="card"><div class="k">Ready to open</div><div class="v">${S.ready||0}</div>
  <div class="n">clear every machine check</div></div></div>`:''}

<h2>What is holding books at the gate</h2>
<div class="wrap"><table><thead><tr><th>Reason</th><th class="num">Books</th></tr></thead><tbody>
${(S.blockers||[]).map(b=>`<tr><td>${b.reason}</td><td class="num">${b.books}</td></tr>`).join('')
  ||'<tr><td colspan=2 class="dim">nothing blocked</td></tr>'}
</tbody></table></div>

<h2>The diagnostic ladder</h2>
<p class="dim">Read top down. Fixing a low rung while a higher one is broken wastes money,
because the higher rung throttles everything below it.</p>
<div class="wrap"><table><thead><tr><th>#</th><th>Symptom</th><th>What it means</th><th>Fix, in this order</th></tr></thead>
<tbody>${(D.ladder||[]).map(l=>`<tr><td class="num">${l.rung}</td><td><b>${l.symptom}</b></td>
<td>${l.means}</td><td>${l.fix}</td></tr>`).join('')}</tbody></table></div>

<h2>Every book, by stage</h2>
<div class="wrap"><table><thead><tr><th>Stage</th><th>Book</th><th class="num">Clicks</th>
<th class="num">Orders</th><th class="num">Spend</th><th class="num">Max CPC</th><th>Why it is here</th></tr></thead>
<tbody>${stageOrder.flatMap(k=>stageBooks(k).map(b=>`<tr>
<td><span class="tag">${b.stageLabel||''}</span></td>
<td>${(b.title||'').slice(0,52)}<div class="dim">${b.asin} &middot; ${b.format||''}</div></td>
<td class="num">${fmt(b.clicks)}</td><td class="num">${fmt(b.orders)}</td>
<td class="num">${money(b.spend)}</td><td class="num">${b.targetCpc!=null?money(b.targetCpc):'<span class="dim">-</span>'}</td>
<td class="dim">${b.stageWhy||''}</td></tr>`)).join('')}</tbody></table></div>

<h2>What each stage does</h2>
<div class="wrap"><table><thead><tr><th>Stage</th><th>Objective</th><th>Bid</th><th class="num">Budget</th>
<th>Expected ACOS</th><th>Ends when</th></tr></thead><tbody>
${stageOrder.map(k=>{const s=S.spec[k]||{};return `<tr><td><b>${s.label||k}</b></td><td>${s.objective||''}</td>
<td>${s.bidScale? (s.bidScale*100)+'% of Amazon low':'<span class="dim">per book</span>'}</td>
<td class="num">${s.budget? money(s.budget):'<span class="dim">0</span>'}</td>
<td>${s.acosRange? s.acosRange[0]+' to '+s.acosRange[1]+'%':'<span class="dim">vs own breakeven</span>'}</td>
<td class="dim">${s.endsWhen||''}</td></tr>`}).join('')}
</tbody></table></div>`;

/* ---------- overview ---------- */
const t = D.totals;
$('#stamp').textContent = t.books+' books tracked  |  '+t.priced+' priced from KDP  |  '
  + t.advertised+' advertised  |  '+t.eligible+' ad-eligible';

const impr=t.impressions||0, clicks=t.clicks||0, orders=t.orders||0;
const w = v => Math.max(4, impr? v/impr*100 : 0);
$('#overview').innerHTML = `
<div class="funnel">
  <div class="stage"><div class="tag">TOFU &middot; reach</div><div class="big">${fmt(impr)}</div>
    <div class="rate">impressions served</div><div class="bar" style="width:100%"></div></div>
  <div class="stage"><div class="tag">MOFU &middot; consideration</div><div class="big">${fmt(clicks)}</div>
    <div class="rate">clicks &middot; CTR ${pct(t.ctr)} &middot; CPC ${money(t.cpc)}</div>
    <div class="bar" style="width:${w(clicks)}%"></div></div>
  <div class="stage"><div class="tag">BOFU &middot; purchase</div><div class="big">${fmt(orders)}</div>
    <div class="rate">orders &middot; CVR ${pct(t.cvr)} &middot; sales ${money(t.sales)}</div>
    <div class="bar" style="width:${w(orders)}%"></div></div>
</div>
<div class="cards">
  <div class="card"><div class="k">Ad spend</div><div class="v">${money(t.spend)}</div><div class="n">all tracked days</div></div>
  <div class="card"><div class="k">Ad sales</div><div class="v">${money(t.sales)}</div><div class="n">${orders} orders</div></div>
  <div class="card"><div class="k">ACOS</div><div class="v ${t.acos && t.medianBreakeven && t.acos>t.medianBreakeven?'bad':''}">${pct(t.acos)}</div>
    <div class="n">breakeven ${pct(t.medianBreakeven)} median</div></div>
  <div class="card"><div class="k">Books priced</div><div class="v">${t.priced}/${t.books}</div><div class="n">real KDP royalty</div></div>
  <div class="card"><div class="k">Zero reviews</div><div class="v">${t.zeroReviews}</div><div class="n">of ${t.books} books</div></div>
</div>
<h2>Daily trend</h2>
<div class="wrap"><table><thead><tr><th>Date</th><th class="num">Impr</th><th class="num">Clicks</th>
<th class="num">Spend</th><th class="num">Orders</th><th class="num">Sales</th><th class="num">ACOS</th></tr></thead>
<tbody>${D.series.slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td class="num">${fmt(s.impressions)}</td>
<td class="num">${fmt(s.clicks)}</td><td class="num">${money(s.spend)}</td><td class="num">${fmt(s.orders)}</td>
<td class="num">${money(s.sales)}</td><td class="num">${s.sales? pct(s.spend/s.sales*100):'<span class="dim">-</span>'}</td></tr>`).join('')||'<tr><td colspan=7 class="dim">no daily data yet</td></tr>'}</tbody></table></div>`;

/* ---------- books ---------- */
const badge = b => {
  const v=b.verdict;
  const cls = v==='profitable'?'good' : (v==='far above breakeven'||v==='listing not converting')?'bad'
            : v==='above breakeven'?'warn':'dim';
  return `<span class="pill ${cls}">${v}</span>`;
};
let sortKey='spend', sortDir=-1;
function renderBooks(){
  const q=($('#q')?.value||'').toLowerCase(), f=$('#f')?.value||'all';
  let rows = D.books.filter(b=>{
    if(q && !((b.title+' '+b.asin+' '+b.author).toLowerCase().includes(q))) return false;
    if(f==='advertised') return b.advertised;
    if(f==='eligible') return b.eligible;
    if(f==='excluded') return !b.eligible;
    if(f==='kindle') return /kindle/i.test(b.format);
    if(f==='spending') return b.spend>0;
    return true;
  });
  rows.sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    return (x>y?1:x<y?-1:0)*sortDir;
  });
  const sev = b => b.verdict==='profitable'?'sev-good'
    : (b.verdict==='far above breakeven'||b.verdict==='listing not converting')?'sev-bad'
    : b.verdict==='above breakeven'?'sev-warn':'';
  $('#tbody').innerHTML = rows.map(b=>`<tr class="${sev(b)}">
    <td class="t" title="${b.title.replace(/"/g,'&quot;')}">${b.title||b.asin}
        <div class="dim" style="font-size:11px">${b.asin} &middot; ${b.format}${b.siblings.length?' &middot; also '+b.siblings.join(', '):''}</div></td>
    <td>${b.type}</td>
    <td class="num">${b.rating!=null?b.rating:'<span class="dim">-</span>'}</td>
    <td class="num">${fmt(b.reviews)}</td>
    <td class="num">${b.bsr?fmt(b.bsr):'<span class="dim">-</span>'}</td>
    <td class="num">${money(b.price)}</td>
    <td class="num">${money(b.royalty)}</td>
    <td class="num">${b.breakeven!=null?pct(b.breakeven):'<span class="dim">-</span>'}</td>
    <td class="num">${fmt(b.impressions)}</td>
    <td class="num">${fmt(b.clicks)}</td>
    <td class="num">${b.ctr!=null?pct(b.ctr):'<span class="dim">-</span>'}</td>
    <td class="num">${b.cvr!=null?pct(b.cvr):'<span class="dim">-</span>'}</td>
    <td class="num">${money(b.spend)}</td>
    <td class="num">${b.acos!=null?pct(b.acos):'<span class="dim">-</span>'}</td>
    <td>${badge(b)}${b.excluded?`<div class="dim" style="font-size:11px">${b.excluded}</div>`:''}</td>
    <td class="dim" style="font-size:11px">${b.plan.length?b.plan.map(p=>p.action).join(', '):''}</td>
  </tr>`).join('');
  $('#count').textContent = rows.length+' books';
}
$('#books').innerHTML = `
<div class="row filters">
  <input id="q" placeholder="search title, asin, imprint" style="min-width:250px">
  <select id="f">
    <option value="all">all books</option><option value="advertised">advertised</option>
    <option value="eligible">ad-eligible</option><option value="excluded">excluded</option>
    <option value="kindle">kindle editions</option><option value="spending">spending money</option>
  </select>
  <span class="msg" id="count"></span>
</div>
<div class="wrap"><table><thead><tr>
${[['title','Book'],['type','Type'],['rating','Rating'],['reviews','Reviews'],['bsr','BSR'],
   ['price','Price'],['royalty','Royalty'],['breakeven','Breakeven'],['impressions','Impr'],
   ['clicks','Clicks'],['ctr','CTR'],['cvr','CVR'],['spend','Spend'],['acos','ACOS'],
   ['verdict','Verdict'],['plan','Plan']].map(([k,l])=>`<th data-k="${k}">${l}</th>`).join('')}
</tr></thead><tbody id="tbody"></tbody></table></div>`;
$('#q').oninput=renderBooks; $('#f').onchange=renderBooks;
document.querySelectorAll('#books th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; sortDir = (k===sortKey)? -sortDir : -1; sortKey=k; renderBooks();
});
renderBooks();

/* ---------- plan ---------- */
$('#plan').innerHTML = D.plan.length ? `
<p class="note">The latest proposed changes. Nothing here has been applied. Run
<code>python ads.py apply --plan plan.json --yes</code> to execute.</p>
<div class="wrap"><table><thead><tr><th>Action</th><th>Target</th><th>Match</th>
<th class="num">Clicks</th><th class="num">Orders</th><th class="num">Spend</th><th class="num">ACOS</th>
<th>Change</th><th>Rule</th></tr></thead><tbody>
${D.plan.map(p=>`<tr><td>${p.action}</td><td class="t">${p.keyword||p.text||''}</td><td>${p.matchType||''}</td>
<td class="num">${fmt(p.metrics?.clicks)}</td><td class="num">${fmt(p.metrics?.orders)}</td>
<td class="num">${money(p.metrics?.spend)}</td><td class="num">${p.metrics?.acos!=null?pct(p.metrics.acos):'-'}</td>
<td>${p.from!=null?p.from+' &rarr; '+p.to:''}</td><td class="dim">${p.rule||''}</td></tr>`).join('')}
</tbody></table></div>` : '<p class="note">No plan file yet. Run <code>python ads.py optimize</code>.</p>';

/* ---------- rules ---------- */
$('#rules').innerHTML = `
<p class="note">These rules drive every automated decision. Edit them here, then
<b>Download</b> and replace <code>rules.json</code> in the repo. Changes take effect on the
next <code>optimize</code> run. Filters accept <code>&gt; &gt;= &lt; &lt;= == !=</code> over
impressions, clicks, spend, orders, sales, acos, cpc, ctr and cvr. First matching rule wins,
so order is priority.</p>
<textarea id="ed" spellcheck="false"></textarea>
<div class="row">
  <button class="act" id="dl">Download rules.json</button>
  <button class="ghost" id="copy">Copy</button>
  <button class="ghost" id="reset">Reset</button>
  <span class="msg" id="stat"></span>
</div>`;
const ed=$('#ed'); ed.value=JSON.stringify(D.rules,null,2);
const stat=$('#stat');
function parsed(){ try{ const o=JSON.parse(ed.value); stat.textContent='valid JSON'; stat.style.color='var(--good)'; return o; }
  catch(e){ stat.textContent=e.message; stat.style.color='var(--bad)'; return null; } }
ed.oninput=parsed; parsed();
$('#dl').onclick=()=>{ const o=parsed(); if(!o) return;
  const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='rules.json'; a.click(); };
$('#copy').onclick=async()=>{ const o=parsed(); if(!o) return;
  await navigator.clipboard.writeText(JSON.stringify(o,null,2)); stat.textContent='copied'; };
$('#reset').onclick=()=>{ ed.value=JSON.stringify(D.rules,null,2); parsed(); };
</script>
