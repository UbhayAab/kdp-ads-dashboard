*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);

nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px}

th{text-align:left;color:var(--dim);font-weight:500;padding:8px 9px;border-bottom:1px solid var(--line);

td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel)}

.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.t{max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;border:1px solid var(--line)}
.good{color:var(--good);border-color:var(--good)}.warn{color:var(--warn);border-color:var(--warn)}
.bad{color:var(--bad);border-color:var(--bad)}.dim{color:var(--dim)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.card .v,.stage .big{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:440px;background:var(--panel);color:var(--fg);border:1px solid var(--line);

button.act{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
button.ghost{background:none;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
.row{display:flex;gap:9px;align-items:center;margin:11px 0;flex-wrap:wrap}
.msg{color:var(--dim);font-size:12px}
.filters input,.filters select{background:var(--panel);color:var(--fg);border:1px solid var(--line);
border-radius:7px;padding:7px 10px;font-size:13px}
h2{font-size:14px;margin:22px 0 9px}
.note{color:var(--dim);font-size:12px;margin:8px 0 16px;max-width:760px}
code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:12px}

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const fmt = (v,d=0)=> v==null||v===''? '<span class="dim">-</span>' : Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const money = v => v==null? '<span class="dim">-</span>' : '$'+Number(v).toFixed(2);
const pct = v => v==null? '<span class="dim">-</span>' : Number(v).toFixed(1)+'%';

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['overview','books','plan','rules'].forEach(t=>$('#'+t).hidden = t!==b.dataset.tab);
});

/* ---------- overview ---------- */
const t = D.totals;
$('#stamp').textContent = t.books+' books tracked  |  '+t.priced+' priced from KDP  |  '
  + t.advertised+' advertised  |  '+t.eligible+' ad-eligible';

const impr=t.impressions||0, clicks=t.clicks||0, orders=t.orders||0;
const w = v => Math.max(4, impr? v/impr*100 : 0);
$('#overview').innerHTML = `
<div class="funnel">
  <div class="stage"><div class="tag">TOFU &middot; reach</div><div class="big">${fmt(impr)}</div>
    <div class="rate">impressions served</div><div class="bar" style="width:100%"></div></div>
  <div class="stage"><div class="tag">MOFU &middot; consideration</div><div class="big">${fmt(clicks)}</div>
    <div class="rate">clicks &middot; CTR ${pct(t.ctr)} &middot; CPC ${money(t.cpc)}</div>
    <div class="bar" style="width:${w(clicks)}%"></div></div>
  <div class="stage"><div class="tag">BOFU &middot; purchase</div><div class="big">${fmt(orders)}</div>
    <div class="rate">orders &middot; CVR ${pct(t.cvr)} &middot; sales ${money(t.sales)}</div>
    <div class="bar" style="width:${w(orders)}%"></div></div>
</div>
<div class="cards">
  <div class="card"><div class="k">Ad spend</div><div class="v">${money(t.spend)}</div><div class="n">all tracked days</div></div>
  <div class="card"><div class="k">Ad sales</div><div class="v">${money(t.sales)}</div><div class="n">${orders} orders</div></div>
  <div class="card"><div class="k">ACOS</div><div class="v ${t.acos && t.medianBreakeven && t.acos>t.medianBreakeven?'bad':''}">${pct(t.acos)}</div>
    <div class="n">breakeven ${pct(t.medianBreakeven)} median</div></div>
  <div class="card"><div class="k">Books priced</div><div class="v">${t.priced}/${t.books}</div><div class="n">real KDP royalty</div></div>
  <div class="card"><div class="k">Zero reviews</div><div class="v">${t.zeroReviews}</div><div class="n">of ${t.books} books</div></div>
</div>
<h2>Daily trend</h2>
<div class="wrap"><table><thead><tr><th>Date</th><th class="num">Impr</th><th class="num">Clicks</th>
<th class="num">Spend</th><th class="num">Orders</th><th class="num">Sales</th><th class="num">ACOS</th></tr></thead>
<tbody>${D.series.slice(-30).reverse().map(s=>`<tr><td>${s.date}</td><td class="num">${fmt(s.impressions)}</td>
<td class="num">${fmt(s.clicks)}</td><td class="num">${money(s.spend)}</td><td class="num">${fmt(s.orders)}</td>
<td class="num">${money(s.sales)}</td><td class="num">${s.sales? pct(s.spend/s.sales*100):'<span class="dim">-</span>'}</td></tr>`).join('')||'<tr><td colspan=7 class="dim">no daily data yet</td></tr>'}</tbody></table></div>`;

/* ---------- books ---------- */
const badge = b => {
  const v=b.verdict;
  const cls = v==='profitable'?'good' : (v==='far above breakeven'||v==='listing not converting')?'bad'
            : v==='above breakeven'?'warn':'dim';
  return `<span class="pill ${cls}">${v}</span>`;
};
let sortKey='spend', sortDir=-1;
function renderBooks(){
  const q=($('#q')?.value||'').toLowerCase(), f=$('#f')?.value||'all';
  let rows = D.books.filter(b=>{
    if(q && !((b.title+' '+b.asin+' '+b.author).toLowerCase().includes(q))) return false;
    if(f==='advertised') return b.advertised;
    if(f==='eligible') return b.eligible;
    if(f==='excluded') return !b.eligible;
    if(f==='kindle') return /kindle/i.test(b.format);
    if(f==='spending') return b.spend>0;
    return true;
  });
  rows.sort((a,b)=>{
    const x=a[sortKey], y=b[sortKey];
    if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    return (x>y?1:x<y?-1:0)*sortDir;
  });
  const sev = b => b.verdict==='profitable'?'sev-good'
    : (b.verdict==='far above breakeven'||b.verdict==='listing not converting')?'sev-bad'
    : b.verdict==='above breakeven'?'sev-warn':'';
  $('#tbody').innerHTML = rows.map(b=>`<tr class="${sev(b)}">
    <td class="t" title="${b.title.replace(/"/g,'&quot;')}">${b.title||b.asin}
        <div class="dim" style="font-size:11px">${b.asin} &middot; ${b.format}${b.siblings.length?' &middot; also '+b.siblings.join(', '):''}</div></td>
    <td>${b.type}</td>
    <td class="num">${b.rating!=null?b.rating:'<span class="dim">-</span>'}</td>
    <td class="num">${fmt(b.reviews)}</td>
    <td class="num">${b.bsr?fmt(b.bsr):'<span class="dim">-</span>'}</td>
    <td class="num">${money(b.price)}</td>
    <td class="num">${money(b.royalty)}</td>
    <td class="num">${b.breakeven!=null?pct(b.breakeven):'<span class="dim">-</span>'}</td>
    <td class="num">${fmt(b.impressions)}</td>
    <td class="num">${fmt(b.clicks)}</td>
    <td class="num">${b.ctr!=null?pct(b.ctr):'<span class="dim">-</span>'}</td>
    <td class="num">${b.cvr!=null?pct(b.cvr):'<span class="dim">-</span>'}</td>
    <td class="num">${money(b.spend)}</td>
    <td class="num">${b.acos!=null?pct(b.acos):'<span class="dim">-</span>'}</td>
    <td>${badge(b)}${b.excluded?`<div class="dim" style="font-size:11px">${b.excluded}</div>`:''}</td>
    <td class="dim" style="font-size:11px">${b.plan.length?b.plan.map(p=>p.action).join(', '):''}</td>
  </tr>`).join('');
  $('#count').textContent = rows.length+' books';
}
$('#books').innerHTML = `
<div class="row filters">
  <input id="q" placeholder="search title, asin, imprint" style="min-width:250px">
  <select id="f">
    <option value="all">all books</option><option value="advertised">advertised</option>
    <option value="eligible">ad-eligible</option><option value="excluded">excluded</option>
    <option value="kindle">kindle editions</option><option value="spending">spending money</option>
  </select>
  <span class="msg" id="count"></span>
</div>
<div class="wrap"><table><thead><tr>
${[['title','Book'],['type','Type'],['rating','Rating'],['reviews','Reviews'],['bsr','BSR'],
   ['price','Price'],['royalty','Royalty'],['breakeven','Breakeven'],['impressions','Impr'],
   ['clicks','Clicks'],['ctr','CTR'],['cvr','CVR'],['spend','Spend'],['acos','ACOS'],
   ['verdict','Verdict'],['plan','Plan']].map(([k,l])=>`<th data-k="${k}">${l}</th>`).join('')}
</tr></thead><tbody id="tbody"></tbody></table></div>`;
$('#q').oninput=renderBooks; $('#f').onchange=renderBooks;
document.querySelectorAll('#books th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; sortDir = (k===sortKey)? -sortDir : -1; sortKey=k; renderBooks();
});
renderBooks();

/* ---------- plan ---------- */
$('#plan').innerHTML = D.plan.length ? `
<p class="note">The latest proposed changes. Nothing here has been applied. Run
<code>python ads.py apply --plan plan.json --yes</code> to execute.</p>
<div class="wrap"><table><thead><tr><th>Action</th><th>Target</th><th>Match</th>
<th class="num">Clicks</th><th class="num">Orders</th><th class="num">Spend</th><th class="num">ACOS</th>
<th>Change</th><th>Rule</th></tr></thead><tbody>
${D.plan.map(p=>`<tr><td>${p.action}</td><td class="t">${p.keyword||p.text||''}</td><td>${p.matchType||''}</td>
<td class="num">${fmt(p.metrics?.clicks)}</td><td class="num">${fmt(p.metrics?.orders)}</td>
<td class="num">${money(p.metrics?.spend)}</td><td class="num">${p.metrics?.acos!=null?pct(p.metrics.acos):'-'}</td>
<td>${p.from!=null?p.from+' &rarr; '+p.to:''}</td><td class="dim">${p.rule||''}</td></tr>`).join('')}
</tbody></table></div>` : '<p class="note">No plan file yet. Run <code>python ads.py optimize</code>.</p>';

/* ---------- rules ---------- */
$('#rules').innerHTML = `
<p class="note">These rules drive every automated decision. Edit them here, then
<b>Download</b> and replace <code>rules.json</code> in the repo. Changes take effect on the
next <code>optimize</code> run. Filters accept <code>&gt; &gt;= &lt; &lt;= == !=</code> over
impressions, clicks, spend, orders, sales, acos, cpc, ctr and cvr. First matching rule wins,
so order is priority.</p>
<textarea id="ed" spellcheck="false"></textarea>
<div class="row">
  <button class="act" id="dl">Download rules.json</button>
  <button class="ghost" id="copy">Copy</button>
  <button class="ghost" id="reset">Reset</button>
  <span class="msg" id="stat"></span>
</div>`;
const ed=$('#ed'); ed.value=JSON.stringify(D.rules,null,2);
const stat=$('#stat');
function parsed(){ try{ const o=JSON.parse(ed.value); stat.textContent='valid JSON'; stat.style.color='var(--good)'; return o; }
  catch(e){ stat.textContent=e.message; stat.style.color='var(--bad)'; return null; } }
ed.oninput=parsed; parsed();
$('#dl').onclick=()=>{ const o=parsed(); if(!o) return;
  const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='rules.json'; a.click(); };
$('#copy').onclick=async()=>{ const o=parsed(); if(!o) return;
  await navigator.clipboard.writeText(JSON.stringify(o,null,2)); stat.textContent='copied'; };
$('#reset').onclick=()=>{ ed.value=JSON.stringify(D.rules,null,2); parsed(); };
</script>
